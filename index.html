<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>还清日</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="还清日：免费开源的还债计划工具。录入每笔债，用雪球法或雪崩法算出哪天能还清。数据只存在你自己的浏览器里。">
<style>
/* Layout: one centred app column. Phone = single column + fixed bottom tab bar; ≥880px = tabs move into the header and the overview splits into two columns. */
:root{
  --bg:#EFF4F1; --surface:#FFFFFF; --surface-2:#E4ECE8; --line:#D2DDD7;
  --ink:#12211D; --ink-2:#465952; --ink-3:#73847D;
  --accent:#17765A; --accent-soft:#D8EEE4; --accent-ink:#0F5A44; --on-accent:#FFFFFF;
  --focus:#C0841D; --focus-soft:#F7EAD1; --focus-ink:#7E5208;
  --danger:#B4432E; --danger-soft:#F8E1DA; --danger-ink:#8E2F1F;
  --scrim:rgba(10,20,17,.45); --shadow:0 1px 2px rgba(18,33,29,.06),0 6px 20px rgba(18,33,29,.06);
  --s-exp:#2a78d6; --s-min:#e87ba4; --s-extra:#eda100; --s-left:#1baf7a;
  --font-sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1412; --surface:#141F1C; --surface-2:#1C2925; --line:#283833;
    --ink:#E4EEE9; --ink-2:#A7B9B2; --ink-3:#71847D;
    --accent:#4CBB8D; --accent-soft:#163A2E; --accent-ink:#8FDDB9; --on-accent:#08201A;
    --focus:#E2A645; --focus-soft:#3A2B12; --focus-ink:#F2C67E;
    --danger:#E27C65; --danger-soft:#3D1E17; --danger-ink:#F3A894;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --s-exp:#3987e5; --s-min:#d55181; --s-extra:#c98500; --s-left:#199e70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1412; --surface:#141F1C; --surface-2:#1C2925; --line:#283833;
  --ink:#E4EEE9; --ink-2:#A7B9B2; --ink-3:#71847D;
  --accent:#4CBB8D; --accent-soft:#163A2E; --accent-ink:#8FDDB9; --on-accent:#08201A;
  --focus:#E2A645; --focus-soft:#3A2B12; --focus-ink:#F2C67E;
  --danger:#E27C65; --danger-soft:#3D1E17; --danger-ink:#F3A894;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --s-exp:#3987e5; --s-min:#d55181; --s-extra:#c98500; --s-left:#199e70;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.grow{flex:1 1 auto;min-width:0}

.shell{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 104px}
@media (min-width:880px){.shell{padding-block:18px 56px}}

/* header */
.top{display:flex;align-items:center;gap:16px;padding-block:6px 18px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.word{font-family:var(--font-display);font-size:27px;font-weight:700;letter-spacing:.08em;line-height:1}
.word i{font-style:normal;color:var(--accent)}
.tag{font-size:12px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs-top{display:none;margin-left:auto;gap:2px;background:var(--surface-2);padding:4px;border-radius:999px}
@media (min-width:880px){.tabs-top{display:flex}}
.tabs-top button{border:0;background:transparent;padding:7px 16px;border-radius:999px;color:var(--ink-2);font-size:14px;cursor:pointer}
.tabs-top button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.tabs-bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
@media (min-width:880px){.tabs-bottom{display:none}}
.tabs-bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;color:var(--ink-3);font-size:11px;cursor:pointer;border-radius:10px}
.tabs-bottom button svg{width:22px;height:22px}
.tabs-bottom button[aria-current="page"]{color:var(--accent);font-weight:600}

/* building blocks */
.stack{display:grid;gap:16px}
.grid2{display:grid;gap:16px}
@media (min-width:880px){.grid2{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}}
.cards{display:grid;gap:12px}
@media (min-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h2{font-size:17px;font-weight:650}
.card-h .grow + *{flex:0 0 auto}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:22px;font-weight:700}
.lead{font-size:14px;color:var(--ink-2);max-width:62ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);font-size:14px;cursor:pointer;min-height:40px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--danger-ink);border-color:var(--danger-soft)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:1.4;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.focus{background:var(--focus-soft);color:var(--focus-ink)}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink)}
.chip.warn{background:var(--danger-soft);color:var(--danger-ink)}

.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field .err{font-size:12px;color:var(--danger-ink)}
input[type="text"],input[type="number"],input[type="date"],select,textarea{width:100%;min-width:0;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
textarea{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{min-width:0}
.money-in{position:relative}
.money-in input{padding-left:28px}
.money-in::before{content:"¥";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:15px;pointer-events:none}

.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .amt{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line)}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--focus-soft);color:var(--focus-ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner b{font-weight:650}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.warns{display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--danger-soft);color:var(--danger-ink);border-radius:12px;padding:10px 12px;font-size:13px}
.warn svg{flex:0 0 16px;margin-top:2px}

/* hero */
.hero{position:relative;overflow:hidden}
.hero .eyebrow{font-size:13px;color:var(--ink-2)}
.hero .date{font-size:clamp(40px,10vw,58px);font-weight:700;letter-spacing:-.01em;line-height:1.08;margin:6px 0 4px}
.hero .date small{font-size:.42em;font-weight:600;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .k{font-size:12px;color:var(--ink-3)}
.stat .v{font-size:17px;font-weight:650;overflow-wrap:anywhere}
.shore{margin-top:18px}
.shore-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.track{position:relative;height:10px;border-radius:999px;background:var(--surface-2)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);min-width:10px}
.track .land{position:absolute;right:-2px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}

/* debt cards */
.debt{display:grid;gap:10px}
.debt-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.debt-top .name{font-size:16px;font-weight:650;overflow-wrap:anywhere}
.debt-bal{font-size:26px;font-weight:700;line-height:1.1}
.debt-meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.mini{height:6px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.mini i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px}
.debt.cleared{opacity:.8}

/* segmented */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:9px 6px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-size:14px;line-height:1.25}
.seg button small{display:block;font-size:11px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink-3);font-weight:600;border-top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.current td{background:var(--accent-soft)}
tr.current td:first-child{border-radius:8px 0 0 8px}
tr.current td:last-child{border-radius:0 8px 8px 0}

/* timeline */
.tl{display:grid;gap:10px}
.tl-row{display:grid;grid-template-columns:minmax(0,7.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.tl-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.tl-track{position:relative;height:12px}
.tl-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.tl-bar{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 4px 4px 0;min-width:4px}
.tl-bar.focus{background:var(--focus)}
.tl-val{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px}

/* chart */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line);stroke-width:1}
.c-axis{stroke:var(--ink-3);stroke-width:1}
.c-area{fill:var(--accent);fill-opacity:.12}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.c-dot.end{fill:var(--accent)}
.c-txt{fill:var(--ink-3);font-size:11px;font-family:var(--font-sans);font-variant-numeric:tabular-nums}
.c-txt.strong{fill:var(--ink);font-weight:600}
.c-cross{stroke:var(--ink-3);stroke-width:1}
.c-hit{fill:transparent;cursor:crosshair}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;min-width:132px;max-width:220px}
.tip .tv{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tip .tl2{color:var(--ink-3)}
.tip .tc{color:var(--accent-ink);margin-top:4px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* schedule */
.month{border-top:1px solid var(--line)}
.month:first-of-type{border-top:0}
.month summary{display:flex;align-items:center;gap:10px;padding:11px 2px;cursor:pointer;list-style:none;min-width:0}
.month summary::-webkit-details-marker{display:none}
.month summary::before{content:"";flex:0 0 auto;width:7px;height:7px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
.month[open] summary::before{transform:rotate(45deg)}
.m-n{font-weight:650;white-space:nowrap}
.m-d{color:var(--ink-3);font-size:13px;white-space:nowrap}
.m-body{padding:0 0 12px 17px;display:grid;gap:2px}
.m-line{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.m-line .grow{overflow-wrap:anywhere}
.m-foot{font-size:12px;color:var(--ink-3);padding-top:4px}

/* order list */
.olist{display:grid;gap:6px;margin-top:12px}
.oitem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:6px 6px 6px 12px}
.oitem .idx{font-weight:700;color:var(--ink-3);width:1.4em;font-variant-numeric:tabular-nums}
.oitem .grow{overflow-wrap:anywhere}

/* empty */
.empty{text-align:center;padding:28px 12px;display:grid;gap:10px;justify-items:center}
.empty h2{font-size:18px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
@media (min-width:640px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:20px;padding:22px}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:18px;font-weight:700}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:880px){.toast{bottom:28px}}

.foot{margin-top:28px;font-size:12px;color:var(--ink-3);display:grid;gap:4px;text-align:center}
.calc{display:grid;gap:10px}
.calc .res{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:10px 12px}
.calc .res b{font-size:20px;font-variant-numeric:tabular-nums}
.rules{display:grid;gap:10px;padding:0;margin:0;list-style:none;counter-reset:r}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14px}
.rules li::before{counter-increment:r;content:counter(r);font-weight:700;color:var(--accent-ink);background:var(--accent-soft);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-top:1px}
.hot{display:grid;gap:8px;margin-top:4px}
.hot div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hot b{font-size:18px;font-variant-numeric:tabular-nums;user-select:all}
/* budget */
.alloc{display:flex;gap:2px;height:18px;margin:4px 0 12px}
.alloc i{display:block;height:100%;min-width:4px}
.alloc i:first-child{border-radius:4px 0 0 4px}
.alloc i:last-child{border-radius:0 4px 4px 0}
.alloc i:only-child{border-radius:4px}
.lg{display:grid}
.lg-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
.lg-row:first-child{border-top:0}
.lg-row .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.lg-row b{font-variant-numeric:tabular-nums}
.lg-row .pc{color:var(--ink-3);font-size:12px;min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:32px;font-weight:700;line-height:1.15;margin:2px 0}
.meter{height:8px;border-radius:999px;background:var(--accent-soft);position:relative;overflow:hidden;margin-top:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.meter.over{background:var(--danger-soft)}
.meter.over i{background:var(--danger)}
.cat{padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0;padding-top:2px}
.cat-top{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0;padding-top:2px}
.ed .n{grid-column:1 / 3;grid-row:1}
.ed .x{grid-column:3;grid-row:1}
.ed .k{grid-column:1;grid-row:2;padding-left:8px;padding-right:4px}
.ed .a{grid-column:2 / 4;grid-row:2;min-width:0}
.ed.inc{grid-template-columns:minmax(0,1fr) minmax(0,128px) 40px}
.ed.inc .n{grid-column:1}
.ed.inc .a{grid-column:2;grid-row:1}
@media (min-width:560px){
  .ed{grid-template-columns:minmax(0,1fr) 80px minmax(0,140px) 40px}
  .ed .n{grid-column:1}
  .ed .k{grid-column:2;grid-row:1}
  .ed .a{grid-column:3;grid-row:1}
  .ed .x{grid-column:4}
  .ed.inc{grid-template-columns:minmax(0,1fr) minmax(0,140px) 40px}
  .ed.inc .a{grid-column:2}
  .ed.inc .x{grid-column:3}
}

/* ---------- utilities ---------- */

/* ---------- storage (falls back to memory when the browser blocks it) ---------- */

var CAT_DEFAULT = [['房租 / 房贷','fixed'],['吃饭','daily'],['交通','daily'],['水电、话费、网费','fixed'],['孩子、赡养老人','fixed'],['保险、看病','fixed'],['日用杂项','daily'],['零花钱','daily']];
function emptyState(){

    incomes:[{id:uid(), name:'工资', amount:''}],

}

    {id:'ex3', name:'网贷X', type:'网贷', balance:25000, start:26350, apr:24, min:1350, due:15, note:''},

    {id:'exc3', name:'交通', kind:'daily', budget:300}, {id:'exc4', name:'水电、话费、网费', kind:'fixed', budget:300},
    {id:'exc5', name:'孩子、赡养老人', kind:'fixed', budget:800}, {id:'exc6', name:'保险、看病', kind:'fixed', budget:200},

}
function normalize(s){
  if (!s || typeof s !== 'object' || !Array.isArray(s.debts)) return null;

    return {id:String(d.id), name:String(d.name || '未命名'), type:TYPES.indexOf(d.type) >= 0 ? d.type : '其他', balance:Math.max(0, r2(num(d.balance))), start:Math.max(num(d.start), num(d.balance)), apr:Math.max(0, num(d.apr)), min:Math.max(0, num(d.min)), due:d.due ? Math.min(31, Math.max(1, Math.round(num(d.due)))) : '', note:String(d.note || ''), clearedAt:d.clearedAt || ''};

  s.cats = s.cats.filter(function(x){ return x && typeof x === 'object'; }).map(function(c){ return {id:String(c.id || uid()), name:String(c.name || ''), kind:c.kind === 'daily' ? 'daily' : 'fixed', budget:(c.budget === '' || c.budget == null) ? '' : Math.max(0, r2(num(c.budget)))}; });
  if (!Array.isArray(s.spends)) s.spends = [];
  s.spends = s.spends.filter(function(x){ return x && /^\d{4}-\d{2}-\d{2}$/.test(String(x.date)); }).map(function(x){ return {id:String(x.id || uid()), date:String(x.date), catId:String(x.catId || ''), catName:String(x.catName || ''), amount:Math.max(0, r2(num(x.amount))), note:String(x.note || '')}; });

  if (!Array.isArray(s.customOrder)) s.customOrder = [];
  if (!Array.isArray(s.snowflakes)) s.snowflakes = [];
  if (!Array.isArray(s.log)) s.log = [];

}

var state = normalize(readStore()) || exampleState();
var ui = {tab:'overview', showAll:false, showAllSpends:false, sheet:null, logPrefill:null, spendCat:null};
var originalTheme = document.documentElement.getAttribute('data-theme');

/* ---------- plan engine ---------- */
function activeDebts(){ return state.debts.filter(function(d){ return d.balance > 0.005; }); }
function orderFor(strat){
  var list = activeDebts().map(function(d){ return {d:d, i:state.debts.indexOf(d)}; });
  if (strat === 'avalanche'){
    list.sort(function(a, b){ return (b.d.apr - a.d.apr) || (a.i - b.i); });
  } else if (strat === 'custom'){
    var co = state.customOrder || [];
    list.sort(function(a, b){
      var x = co.indexOf(a.d.id), y = co.indexOf(b.d.id);
      if (x < 0) x = 1e6 + a.i;
      if (y < 0) y = 1e6 + b.i;
      return x - y;
    });

    list.sort(function(a, b){ return (a.d.balance - b.d.balance) || (a.i - b.i); });
  }
  return list.map(function(x){ return x.d; });
}
function simulate(strat, extraOverride){
  var MAX = 360;
  var order = orderFor(strat);
  var extra = extraOverride !== undefined ? extraOverride : Math.max(0, num(state.extra));
  var snow = {};
  (state.snowflakes || []).forEach(function(s){
    var k = ymDiff(state.startYM, s.ym) + 1;
    if (k >= 1) snow[k] = (snow[k] || 0) + Math.max(0, num(s.amount));
  });
  var ds = order.map(function(d){ return {id:d.id, bal:r2(d.balance), rate:Math.max(0, num(d.apr)) / 100, min:Math.max(0, num(d.min)), it:0}; });

  ds.forEach(function(d){ minTotal += d.min; startTotal += d.bal; });
  var base = minTotal + extra;
  var months = [], payoff = {}, intBy = {}, totalInt = 0;
  ds.forEach(function(d){ intBy[d.id] = 0; });
  for (var t = 1; t <= MAX; t++){
    var any = false, i, d;
    for (i = 0; i < ds.length; i++){ if (ds[i].bal > 0.005){ any = true; break; } }

    var budget = base + (snow[t] || 0);
    var owed = [], mins = [], sumMin = 0;
    for (i = 0; i < ds.length; i++){
      d = ds[i];
      d.it = d.bal > 0.005 ? r2(d.bal * d.rate / 12) : 0;
      owed[i] = r2(d.bal + d.it);
      mins[i] = Math.min(d.min, owed[i]);
      sumMin += mins[i];
    }
    var left = Math.max(0, r2(budget - sumMin));
    var focus = null, pays = {}, paid = 0, cleared = [], total = 0;

      d = ds[i];
      var e = r2(Math.max(0, Math.min(r2(owed[i] - mins[i]), left)));
      left = r2(left - e);
      if (e > 0.005 && focus === null) focus = d.id;
      var p = r2(mins[i] + e);
      pays[d.id] = p;
      paid += p;
      intBy[d.id] += d.it;
      totalInt += d.it;
      var nb = r2(Math.max(0, owed[i] - p));

      d.bal = nb;
      total += nb;
    }
    months.push({t:t, ym:ymAdd(state.startYM, t - 1), pays:pays, focus:focus, paid:r2(paid), total:r2(total), cleared:cleared, snow:snow[t] || 0});

  var done = ds.every(function(x){ return x.bal <= 0.01; });
  var first = null;
  Object.keys(payoff).forEach(function(k){ if (first === null || payoff[k] < first) first = payoff[k]; });
  Object.keys(intBy).forEach(function(k){ intBy[k] = r2(intBy[k]); });

}
function debtById(id){ for (var i = 0; i < state.debts.length; i++){ if (state.debts[i].id === id) return state.debts[i]; } return null; }
function nameOf(id){ var d = debtById(id); return d ? d.name : '已删除'; }
function payoffYM(sim, id){ var m = sim.payoff[id]; return m ? ymAdd(state.startYM, m - 1) : null; }
function endLabel(sim){ return sim.n === null ? '超过 30 年' : (sim.n === 0 ? '—' : ymLabel(ymAdd(state.startYM, sim.n - 1))); }

function debtWarnings(d){
  var w = [];
  var mi = d.balance * d.apr / 100 / 12;
  if (d.balance > 0.005 && d.apr > 0 && d.min < mi - 0.005) w.push('每月最低还款比利息还少（每月利息约 ' + money(mi, 0) + '），这笔会越滚越多。先去跟对方协商降低利息或重新分期。');
  if (d.type === '亲友借款' && d.apr > 12) w.push('民间借贷超过一年期 LPR 4 倍（现在约 12%）的利息，法院不支持。');
  else if (d.type !== '亲友借款' && d.type !== '其他' && d.apr > 24) w.push('年化超过 24%。持牌机构的个人贷款，利息加各种费用的年化不能超过 24%，可以打 12378 投诉。');

}

/* ---------- small renderers ---------- */
var IC_WARN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>';

function moneyInput(id, value, attrs){ return '<div class="money-in"><input type="number" inputmode="decimal" id="' + id + '" value="' + esc(value) + '" ' + (attrs || '') + '></div>'; }

function exampleBanner(){
  if (!state.isExample) return '';

}

/* ---------- budget ---------- */
function incomeTotal(){ var t = 0; state.incomes.forEach(function(x){ t += num(x.amount); }); return r2(t); }

function allocBlock(mp){

    {k:'必要开支', v:mp.exp, c:'var(--s-exp)'},
    {k:'最低还款', v:mp.mn, c:'var(--s-min)'},
    {k:'加速钱（多还）', v:mp.ex, c:'var(--s-extra)'}

  var lg = '<div class="lg">';
  segs.forEach(function(x){
    if (total > 0 && x.v > 0) bar += '<i style="flex:' + (x.v / total).toFixed(4) + ' 1 0;background:' + x.c + '" title="' + x.k + ' ' + money(x.v, 0) + '"></i>';
    lg += '<div class="lg-row"><span class="sw" style="background:' + x.c + '"></span><span class="grow">' + x.k + '</span><b>' + money(x.v, 0) + '</b><span class="pc">' + (mp.inc > 0 ? pct(x.v / mp.inc * 100) : '') + '</span></div>';
  });

}
function moneyCard(){

/* ---------- overview ---------- */
function viewOverview(){
  var sim = simulate(state.strategy);

    return html + '<div class="card empty"><h2>先把你的债摊开看看</h2><p class="lead">把每一笔欠款填进来：欠谁的、还剩多少、利息多少、每月最低还多少。填完马上算出你哪天能还清。</p><div class="btn-row"><button type="button" class="btn primary" data-act="add-debt">添加第一笔债</button><button type="button" class="btn" data-act="load-example">先看示例</button></div></div>';
  }

      '<div class="stat"><div class="k">还要付的利息</div><div class="v num">' + money(sim.totalInt, 0) + '</div></div>' +

    '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(paidPct) + '" aria-label="还款进度"><div class="fill" style="width:' + paidPct.toFixed(2) + '%"></div><div class="land"></div></div></div>' +
  '</section>';

  var m1 = sim.months[0];
  var rows = '';
  sim.order.forEach(function(d){
    var p = m1 ? (m1.pays[d.id] || 0) : 0;
    var isF = m1 && m1.focus === d.id;
    rows += '<div class="row"><div class="grow"><div class="name">' + esc(d.name) + '</div><div class="tiny muted">' + (d.due ? '每月 ' + d.due + ' 号' : '还款日未填') + (isF ? ' · ' : '') + (isF ? '<span class="chip focus">多还的钱给它</span>' : '') + '</div></div>' +
      '<div class="amt">' + money(p) + '</div><button type="button" class="btn sm" data-act="log-for" data-id="' + d.id + '" data-amt="' + p + '">记一笔</button></div>';
  });
  var thisMonth = '<section class="card"><div class="card-h"><h2 class="grow">第 1 个月怎么还</h2>' + chip(m1 ? ymLabel(m1.ym) : '') + '</div>' +
    '<div class="rows">' + rows + '</div>' +
    '<div class="note" style="margin-top:12px">一共还 <b class="num">' + money(m1 ? m1.paid : 0) + '</b> ＝ 所有最低还款 ' + money(sim.minTotal) + ' ＋ 多还 ' + money(m1 ? r2(m1.paid - sim.minTotal) : 0) + (m1 && m1.snow ? '（含一次性多还 ' + money(m1.snow) + '）' : '') + '。多还的钱集中砸向一笔，清掉它再滚到下一笔。</div>' +
  '</section>';

  state.debts.forEach(function(d){ if (d.balance > 0.005) debtWarnings(d).forEach(function(w){ warns.push(d.name + '：' + w); }); });
  var mpw = moneyPlan();
  if (mpw.inc > 0 && mpw.spare < 0) warns.push('收入减去开支，不够付所有最低还款（每月差 ' + money(-mpw.spare, 0) + '）。先停止新借款，再去协商降低月供。');
  else if (mpw.inc > 0 && mpw.left < 0) warns.push('加速钱比收入能拿出来的多 ' + money(-mpw.left, 0) + '，去「计划」调低，别让月底不够用。');

  return html + '<div class="grid2"><div class="stack">' + hero + thisMonth + '</div><div class="stack">' + moneyCard() + chart + warnCard + '</div></div>';

/* ---------- debts ---------- */
function viewDebts(){
  var sim = simulate(state.strategy);
  var act = activeDebts();
  var cleared = state.debts.filter(function(d){ return d.balance <= 0.005; });
  var total = 0, minT = 0;
  act.forEach(function(d){ total += d.balance; minT += d.min; });
  var html = exampleBanner() + '<div class="page-h"><div class="grow"><h1>我的债</h1><p class="small muted">' + act.length + ' 笔没还完 · 一共还欠 <b class="num">' + money(total, 0) + '</b> · 每月最低还款 <b class="num">' + money(minT) + '</b></p></div><button type="button" class="btn primary" data-act="add-debt">＋ 添加一笔债</button></div>';
  if (!state.debts.length){
    return html + '<div class="card empty"><h2>还没有记录</h2><p class="lead">从征信报告、信用卡和各个借钱 App 的账单、亲友借条里，把每一笔都找出来。</p><button type="button" class="btn primary" data-act="add-debt">添加第一笔债</button></div>';
  }
  var pos = {};
  sim.order.forEach(function(d, i){ pos[d.id] = i + 1; });
  var focusId = sim.months[0] ? sim.months[0].focus : null;
  html += '<div class="cards">';
  sim.order.forEach(function(d){
    var py = payoffYM(sim, d.id);
    var prog = d.start > 0 ? Math.max(0, Math.min(100, (d.start - d.balance) / d.start * 100)) : 0;
    var w = debtWarnings(d);
    html += '<article class="card debt">' +
      '<div class="debt-top"><span class="name grow">' + esc(d.name) + '</span>' + chip(d.type) + (d.id === focusId ? chip('现在先还它', 'focus') : chip('第 ' + pos[d.id] + ' 个还', '')) + '</div>' +
      '<div><div class="tiny muted">还欠</div><div class="debt-bal num">' + money(d.balance) + '</div></div>' +
      '<div class="debt-meta"><span>年化 <b>' + pct(d.apr) + '</b></span><span>每月最低 <b class="num">' + money(d.min) + '</b></span><span>' + (d.due ? '每月 ' + d.due + ' 号' : '还款日未填') + '</span></div>' +
      '<div><div class="mini" aria-hidden="true"><i style="width:' + prog.toFixed(1) + '%"></i></div><div class="tiny muted" style="margin-top:4px">已还 ' + pct(prog) + ' · ' + (py ? '按计划 <b>' + ymLabel(py) + '</b>（第 ' + sim.payoff[d.id] + ' 个月）还清' : '30 年内还不完') + '</div></div>' +
      (d.note ? '<div class="tiny sub">备注：' + esc(d.note) + '</div>' : '') +
      (w.length ? '<div class="warns">' + w.map(warnBox).join('') + '</div>' : '') +
      '<div class="btn-row"><button type="button" class="btn sm primary" data-act="log-for" data-id="' + d.id + '" data-amt="' + (sim.months[0] ? (sim.months[0].pays[d.id] || 0) : d.min) + '">记一笔还款</button><button type="button" class="btn sm" data-act="edit-debt" data-id="' + d.id + '">修改</button></div>' +
    '</article>';
  });
  html += '</div>';
  if (cleared.length){
    html += '<h2 style="font-size:16px;margin:22px 0 10px">已经还清 ' + chip(cleared.length + ' 笔', 'ok') + '</h2><div class="cards">';
    cleared.forEach(function(d){
      html += '<article class="card debt cleared"><div class="debt-top"><span class="name grow">' + esc(d.name) + '</span>' + chip('已还清', 'ok') + '</div><div class="tiny muted">原来欠 ' + money(d.start) + (d.clearedAt ? ' · ' + dateLabel(d.clearedAt) + ' 还清' : '') + '</div><div class="btn-row"><button type="button" class="btn sm" data-act="edit-debt" data-id="' + d.id + '">修改</button></div></article>';
    });
    html += '</div>';
  }
  return html;
}

/* ---------- tools ---------- */
function rateSolve(n, pmt, pv){
  if (!(n > 0 && pmt > 0 && pv > 0)) return NaN;
  if (pmt * n < pv - 1e-9) return NaN;
  if (Math.abs(pmt * n - pv) < 1e-9) return 0;
  var lo = 0, hi = 1;
  for (var k = 0; k < 200; k++){
    var mid = (lo + hi) / 2;
    var v = pmt * (1 - Math.pow(1 + mid, -n)) / mid;
    if (v > pv) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}
function calcTools(){
  function setT(id, t){ var el = $(id); if (el) el.textContent = t; }
  var d = num(($('cv-d') || {}).value);
  setT('cv-d-r', d > 0 ? pct(d * 365) : '—');
  var m = num(($('cv-m') || {}).value);
  setT('cv-m-r', m > 0 ? pct(m * 12) : '—');
  var P = num(($('cv-i-p') || {}).value), n = Math.round(num(($('cv-i-n') || {}).value)), f = num(($('cv-i-f') || {}).value);
  if (P > 0 && n > 0 && f >= 0){
    var pay = P / n + P * f / 100;
    var r = rateSolve(n, pay, P);
    setT('cv-i-pay', money(pay, 2));
    setT('cv-i-fee', money(P * f / 100 * n, 2));
    setT('cv-i-face', pct(f * 12));
    setT('cv-i-r', isFinite(r) ? pct(r * 12 * 100) : '—');
  } else { setT('cv-i-pay', '—'); setT('cv-i-fee', '—'); setT('cv-i-face', '—'); setT('cv-i-r', '—'); }
  var L = num(($('cv-l-p') || {}).value), ln = Math.round(num(($('cv-l-n') || {}).value)), lp = num(($('cv-l-pay') || {}).value);
  var lr = rateSolve(ln, lp, L);
  setT('cv-l-more', (L > 0 && ln > 0 && lp > 0) ? money(lp * ln - L, 2) : '—');
  setT('cv-l-r', isFinite(lr) ? pct(lr * 12 * 100) : '—');
  var warn = $('cv-l-w');
  if (warn) warn.hidden = !(isFinite(lr) && lr * 12 > 0.24);
}

/* ---------- chart ---------- */
function niceStep(raw){
  var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
var curveSim = null;
function drawCurve(){
  var el = $('curve');
  if (!el || !curveSim) return;
  var sim = curveSim;
  var pts = [{t:0, ym:null, total:sim.startTotal, cleared:[]}].concat(sim.months);
  var N = pts.length - 1;
  if (N < 1){ el.innerHTML = ''; return; }
  var W = Math.max(280, el.clientWidth || 600), H = W < 520 ? 210 : 250;
  var L = 44, R = 16, T = 14, B = 30;
  var pw = W - L - R, ph = H - T - B;
  var step = niceStep(Math.max(1, sim.startTotal) / 4);
  var maxV = Math.ceil(sim.startTotal / step) * step || step;
  function X(i){ return L + i / N * pw; }
  function Y(v){ return T + ph - v / maxV * ph; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="剩余欠款从 ' + money(sim.startTotal, 0) + ' 降到 0 的曲线">';
  for (var v = 0; v <= maxV + 0.5; v += step){
    var y = Y(v).toFixed(1);
    s += '<line class="c-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/>';
    s += '<text class="c-txt" x="' + (L - 8) + '" y="' + y + '" text-anchor="end" dominant-baseline="middle">' + (v === 0 ? '0' : wan(v)) + '</text>';
  }
  var line = '', area = '';
  pts.forEach(function(p, i){ line += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.total).toFixed(1); });
  area = line + 'L' + X(N).toFixed(1) + ' ' + Y(0).toFixed(1) + 'L' + X(0).toFixed(1) + ' ' + Y(0).toFixed(1) + 'Z';
  s += '<path class="c-area" d="' + area + '"/><path class="c-line" d="' + line + '"/>';
  var ticks = [0, Math.round(N / 3), Math.round(2 * N / 3), N];
  var seen = {};
  ticks.forEach(function(i, k){
    if (seen[i]) return; seen[i] = 1;
    var lab = i === 0 ? '现在' : ymAxis(pts[i].ym) + (i === N && sim.done ? ' 上岸' : '');
    var anchor = k === 0 ? 'start' : (k === ticks.length - 1 ? 'end' : 'middle');
    s += '<text class="c-txt' + (i === N && sim.done ? ' strong' : '') + '" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '">' + lab + '</text>';
  });
  pts.forEach(function(p, i){ if (i > 0 && p.cleared.length) s += '<circle class="c-dot" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.total).toFixed(1) + '" r="4.5"/>'; });
  s += '<line class="c-cross" id="cx" x1="0" x2="0" y1="' + T + '" y2="' + (T + ph) + '" visibility="hidden"/>';
  s += '<circle class="c-dot" id="cd" r="5" cx="0" cy="0" visibility="hidden"/>';
  s += '<rect class="c-hit" id="chit" x="' + L + '" y="0" width="' + pw + '" height="' + (T + ph) + '"/>';
  s += '</svg><div class="tip" id="ctip" hidden></div>';
  el.innerHTML = s;
  var hit = $('chit'), cx = $('cx'), cd = $('cd'), tip = $('ctip');
  function show(evt){
    var rect = el.getBoundingClientRect();
    var px = (evt.clientX - rect.left) * (W / rect.width);
    var i = Math.max(0, Math.min(N, Math.round((px - L) / pw * N)));
    var p = pts[i];
    cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cx.setAttribute('visibility', 'visible');
    cd.setAttribute('cx', X(i)); cd.setAttribute('cy', Y(p.total)); cd.setAttribute('visibility', 'visible');
    tip.innerHTML = '';
    var tv = document.createElement('div'); tv.className = 'tv'; tv.textContent = '还剩 ' + money(p.total, 0); tip.appendChild(tv);
    var tl = document.createElement('div'); tl.className = 'tl2'; tl.textContent = i === 0 ? '现在' : ('第 ' + p.t + ' 个月 · ' + ymLabel(p.ym) + ' · 这月还 ' + money(p.paid, 0)); tip.appendChild(tl);
    if (p.cleared.length){ var tc = document.createElement('div'); tc.className = 'tc'; tc.textContent = '清掉 ' + p.cleared.map(nameOf).join('、'); tip.appendChild(tc); }
    tip.hidden = false;
    var scale = rect.width / W;
    var left = X(i) * scale + 12;
    if (left + tip.offsetWidth > rect.width) left = X(i) * scale - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, left) + 'px';
    tip.style.top = Math.max(0, Y(p.total) * scale - tip.offsetHeight - 10) + 'px';
  }
  function hide(){ cx.setAttribute('visibility', 'hidden'); cd.setAttribute('visibility', 'hidden'); tip.hidden = true; }
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', hide);
}
var ro = null;
function watchCurve(){
  var el = $('curve');
  if (!el) return;
  drawCurve();
  if (window.ResizeObserver){
    if (ro) ro.disconnect();
    var lastW = el.clientWidth;
    ro = new ResizeObserver(function(){ if (Math.abs(el.clientWidth - lastW) > 4){ lastW = el.clientWidth; drawCurve(); } });
    ro.observe(el);
  }
}

/* ---------- render ---------- */
function applyTheme(){

  if (state.theme === 'light' || state.theme === 'dark') root.setAttribute('data-theme', state.theme);
  else if (originalTheme) root.setAttribute('data-theme', originalTheme);
  else root.removeAttribute('data-theme');
}

  renderTabs();

function softRender(){

    var a = document.activeElement, fid = a && a.id, y = window.scrollY;

/* ---------- actions ---------- */
function arm(btn, fn){
  if (btn.getAttribute('data-armed') === '1'){ fn(); return; }
  btn.setAttribute('data-armed', '1');
  var orig = btn.textContent;
  btn.textContent = btn.classList.contains('x') ? '✓' : '再点一次确认';
  if (btn.classList.contains('x')) btn.setAttribute('aria-label', '再点一次确认删除');
  btn.classList.add('armed');
  setTimeout(function(){ if (document.body.contains(btn)){ btn.setAttribute('data-armed', '0'); btn.textContent = orig; btn.classList.remove('armed'); } }, 4000);
}
function copyText(text, el){
  function fallback(){ if (el){ el.focus(); el.select(); } toast('已选中，长按或按 Ctrl+C 复制'); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('已复制'); }, fallback);
    } else fallback();
  } catch (e){ fallback(); }
}
function importData(text){
  var obj = null;
  try { obj = JSON.parse(text); } catch (e) { obj = null; }
  var s = normalize(obj);
  if (!s){ showErr('bk-err', '这不是还清日的备份内容。请粘贴完整的备份（以 { 开头，以 } 结尾）。'); return; }
  state = s; state.isExample = false; save(); applyTheme(); render(); toast('已恢复备份：' + state.debts.length + ' 笔债');
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var act = t.getAttribute('data-act');
  var id = t.getAttribute('data-id');

  if (act === 'edit-debt') return openDebtSheet(id);
  if (act === 'close-sheet') return closeSheet();
  if (act === 'save-debt') return saveDebt(id || null);
  if (act === 'delete-debt') return arm(t, function(){
    state.debts = state.debts.filter(function(d){ return d.id !== id; });
    state.customOrder = state.customOrder.filter(function(x){ return x !== id; });

    var sv = t.getAttribute('data-s');
    if (sv === 'custom' && (!state.customOrder || !state.customOrder.length)) state.customOrder = orderFor(state.strategy).map(function(d){ return d.id; });
    state.strategy = sv; save(); render(); return;
  }

    var ord = orderFor('custom').map(function(d){ return d.id; });
    var i = ord.indexOf(id), j = i + (+t.getAttribute('data-dir'));
    if (i < 0 || j < 0 || j >= ord.length) return;
    var tmp = ord[i]; ord[i] = ord[j]; ord[j] = tmp;

  }

  if (act === 'del-item'){

  }

    else toast('记下了：' + (cc ? cc.name : '') + ' ' + money(sa));

  }
  if (act === 'del-spend') return arm(t, function(){ state.spends = state.spends.filter(function(x){ return x.id !== id; }); save(); render(); toast('已删除'); });

    if (clearedNow) d.clearedAt = date;
    save(); render();
    if (clearedNow) toast('清掉一笔！「' + d.name + '」还清了，还剩 ' + activeDebts().length + ' 笔');
    else toast('记下了，「' + d.name + '」还欠 ' + money(d.balance));
    return;
  }
  if (act === 'del-log') return arm(t, function(){
    var l = null;
    state.log = state.log.filter(function(x){ if (x.id === id){ l = x; return false; } return true; });
    if (l){ var dd = debtById(l.debtId); if (dd){ dd.balance = r2(dd.balance + num(l.amount)); if (dd.balance > dd.start) dd.start = dd.balance; if (dd.balance > 0.005) dd.clearedAt = ''; } }
    save(); render(); toast('已撤销，欠款已加回');
  });
  if (act === 'copy-backup') return copyText(JSON.stringify(state, null, 2), $('bk-out'));
  if (act === 'download-backup'){
    try {
      var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a2 = document.createElement('a');
      a2.href = url; a2.download = '还清日备份-' + todayStr() + '.json';
      document.body.appendChild(a2); a2.click(); a2.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('如果没有开始下载，用「复制备份」');
    } catch (err){ toast('下载不了，用「复制备份」'); }
    return;
  }
  if (act === 'import-backup') return importData($('bk-in').value);
});

document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'bk-file' && t.files && t.files[0]){
    var fr = new FileReader();
    fr.onload = function(){ importData(String(fr.result || '')); };
    fr.readAsText(t.files[0]);
    return;
  }
  var coll = t.getAttribute && t.getAttribute('data-coll');
  var field = t.getAttribute && t.getAttribute('data-field');
  if (coll && field && state[coll]){
    var item = null, iid = t.getAttribute('data-id');
    state[coll].forEach(function(x){ if (x.id === iid) item = x; });
    if (item){
      if (field === 'amount' || field === 'budget') item[field] = t.value === '' ? '' : Math.max(0, r2(num(t.value)));
      else if (field === 'kind') item.kind = t.value === 'daily' ? 'daily' : 'fixed';
      else item[field] = t.value.trim();
      save(); softRender();
    }
    return;
  }
  var key = t.getAttribute && t.getAttribute('data-bind');
  if (!key) return;
  if (key === 'extra') state.extra = Math.max(0, r2(num(t.value)));
  else if (key === 'startYM') state.startYM = t.value;
  else if (key === 'theme'){ state.theme = t.value; applyTheme(); }
  save(); render();
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.getAttribute('data-calc')) calcTools();
  if (t.getAttribute('data-rate')) rateHint();
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && ui.sheet) closeSheet();
  if (e.key === 'Enter' && ui.sheet && e.target.tagName === 'INPUT'){ var b = document.querySelector('[data-act="save-debt"]'); if (b){ e.preventDefault(); b.click(); } }
});
window.addEventListener('hashchange', function(){ var h = (location.hash || '').slice(1); if (h && h !== ui.tab) setTab(h); });

applyTheme();
var h0 = (location.hash || '').slice(1);
ui.tab = TABS.some(function(t){ return t.id === h0; }) ? h0 : 'overview';
render();
save();

window.__hqr = {simulate:simulate, getState:function(){ return state; }, setState:function(s){ state = normalize(s); render(); }};
})();
</script>
</body>
